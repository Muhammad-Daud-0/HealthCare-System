<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f472b6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="plusGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f9ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect x="5" y="5" width="190" height="190" rx="40" fill="url(#bgGradient)"/>
  
  <!-- Subtle inner glow -->
  <rect x="15" y="15" width="170" height="170" rx="35" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  
  <!-- Medical cross/plus symbol with glow -->
  <g filter="url(#glow)">
    <rect x="85" y="50" width="30" height="100" rx="10" fill="url(#plusGradient)"/>
    <rect x="50" y="85" width="100" height="30" rx="10" fill="url(#plusGradient)"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="150" cy="55" r="5" fill="rgba(255,255,255,0.5)"/>
  <circle cx="55" cy="150" r="5" fill="rgba(255,255,255,0.5)"/>
  <circle cx="150" cy="150" r="3" fill="rgba(255,255,255,0.3)"/>
  <circle cx="55" cy="55" r="3" fill="rgba(255,255,255,0.3)"/>
</svg>